function wireLogin(el){
  const f=el.querySelector('#login');
  const go2=s=>{authStep=s;go(0,true)};
  const forgot=el.querySelector('#forgot');if(forgot)forgot.onclick=()=>{pendingEmail=f.querySelector('#em').value.trim();go2('forgot')};
  const signup=el.querySelector('#signup');if(signup)signup.onclick=()=>{pendingEmail=f.querySelector('#em').value.trim();go2('signup')};
  const signup2=el.querySelector('#signup2');if(signup2)signup2.onclick=()=>go2('signup');
  const login2=el.querySelector('#login2');if(login2)login2.onclick=()=>go2('login');
  const resend=el.querySelector('#resend');if(resend)resend.onclick=async()=>{resend.disabled=true;await sb.auth.resend({type:'signup',email:pendingEmail,options:{emailRedirectTo:location.href.split('#')[0]}});resend.disabled=false;toast('Mail opnieuw verstuurd.')};
  if(!f)return;
  const err=f.querySelector('#lerr'),btn=f.querySelector('button[type=submit]');
  const showErr=m=>{err.textContent=m;err.hidden=!m};
  f.querySelectorAll('input').forEach(i=>i.addEventListener('input',()=>showErr('')));
  f.onsubmit=async e=>{
    e.preventDefault();showErr('');
    const em=()=>f.querySelector('#em').value.trim();
    if(authStep==='login'){
      const pw=f.querySelector('#pw').value;
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em())){showErr('Vul een geldig e-mailadres in.');return}
      if(!pw){showErr('Vul je wachtwoord in.');return}
      btn.disabled=true;btn.textContent='Bezig…';verifying=true;
      const {data,error}=await sb.auth.signInWithPassword({email:em(),password:pw});
      btn.disabled=false;btn.textContent='Album openen';
      if(error||!data.session){verifying=false;showErr(/confirm/i.test(error?.message||'')?'Bevestig eerst je e-mailadres via de mail die je kreeg.':'E-mailadres of wachtwoord klopt niet.');return}
      pendingEmail=em();session=data.session;await loadAlbum();verifying=false;go(1);return;
    }
    if(authStep==='signup'){
      const nm=f.querySelector('#nm').value.trim(),pw=f.querySelector('#pw').value;
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em())){showErr('Vul een geldig e-mailadres in.');return}
      if(pw.length<8){showErr('Kies een wachtwoord van minimaal 8 tekens.');return}
      if(nm&&!/^[\p{L}\p{N} .'&-]{1,24}$/u.test(nm)){showErr('Gebruik voor de naam alleen letters, cijfers, spaties en . \' & - (max. 24 tekens).');return}
      btn.disabled=true;btn.textContent='Bezig…';
      const {data,error}=await sb.auth.signUp({email:em(),password:pw,options:{data:nm?{display_name:nm}:{},emailRedirectTo:location.href.split('#')[0]}});
      btn.disabled=false;btn.textContent='Account aanmaken';
      if(error){showErr(/already|registered|exists/i.test(error.message)?'Er bestaat al een account met dit e-mailadres. Log in, of reset je wachtwoord.':'Aanmaken lukte niet. Probeer het opnieuw.');return}
      pendingEmail=em();
      if(data.session){session=data.session;await loadAlbum();go(1);return} // bevestiging staat uit: meteen door
      go2('sent');return;
    }
    if(authStep==='forgot'){
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em())){showErr('Vul een geldig e-mailadres in.');return}
      btn.disabled=true;btn.textContent='Bezig…';
      const {error}=await sb.auth.resetPasswordForEmail(em(),{redirectTo:'https://vineder.nl/'});
      btn.disabled=false;btn.textContent='Stuur resetlink';
      if(error){showErr('Versturen lukte niet. Probeer het opnieuw.');return}
      pendingEmail=em();go2('forgotsent');return;
    }
    if(authStep==='reset'){
      const pw=f.querySelector('#pw').value;
      if(pw.length<8){showErr('Kies een wachtwoord van minimaal 8 tekens.');return}
      btn.disabled=true;btn.textContent='Bezig…';
      const {error}=await sb.auth.updateUser({password:pw});
      btn.disabled=false;btn.textContent='Wachtwoord instellen';
      if(error){showErr('Instellen lukte niet. Vraag een nieuwe resetlink aan.');return}
      toast('Wachtwoord ingesteld.');await loadAlbum();go(1);
    }
  };
}

/* ---------- pagina's ---------- */
function pageFoot(i){return `<div class="pfoot"><span>Vineder</span><span>Blad ${i}</span></div>`}
function icCoins(info){return info.i.map(([a,b2,re,why,leg])=>{const own=iconOwned(re);return `<div class="icn${own?' own':''}${leg?' leg':''}"><span class="coin" title="${leg?'Legende':'Icoon'}">${leg?'♛':'✦'}</span><b>${esc(a)}</b><small>${own?'Je hebt hem!':esc(b2)}</small></div>`}).join('')}
function iconCount(){let h=0,t=0;for(const k in LANDINFO)for(const x of LANDINFO[k].i){if(x[4])continue;t++;if(iconOwned(x[2]))h++}return [h,t]}
function progress(have,n){return `<div class="progress"><span>${have} van ${n}</span><div class="bar"><span style="width:${have/n*100}%"></span></div></div>`}
function firstPageOf(pred){return pages.findIndex(pred)}
/* ---------- kaarten ---------- */
const NAME_OF_ISO=typeof MAPS!=='undefined'?Object.fromEntries(Object.entries(MAPS.ISO).map(([n,i])=>[i,n])):{};
function proj(m,lat,lon){return [(lon-m.b[0])*m.k*m.c,(m.b[3]-lat)*m.k]}
function worldStats(){const tot=Object.keys(MAPS.ISO).length,have=Object.keys(MAPS.ISO).filter(n=>cards.some(c=>c.land===n)).length;return {have,tot}}
function cardPin(c){
  for(const set of SETS){if(set.part!==1||set.land!==c.land)continue;const S=st.stacks[set.id]||[],k=S.findIndex(x=>x.some(y=>y.id===c.id));if(k<0)continue;
    const sp=PINS.slot[set.id]&&PINS.slot[set.id][set.slots[k].l];if(sp)return sp;if(PINS.set[set.id])return PINS.set[set.id]}
  const ce=MAPS.centroid[c.land];return ce?[ce[1],ce[0]]:null;
}
function landPins(land){
  const sets=SETS.filter(x=>x.part===1&&x.land===land&&st.visible[x.id]);
  if(sets.length===1&&PINS.slot[sets[0].id])return setPins(sets[0]);
  return sets.filter(x=>PINS.set[x.id]).map(x=>({ll:PINS.set[x.id],label:x.name,on:started(x),go:firstPageOf(q=>q.set===x),prev:x.id,sub:filledOf(x).filter(Boolean).length+' / '+x.slots.length}));
}
function setPins(set){
  if(PINS.slot[set.id]){const f=filledOf(set);return set.slots.map((sl,k)=>({sl,k})).filter(o=>PINS.slot[set.id][o.sl.l]).map(o=>({ll:PINS.slot[set.id][o.sl.l],label:o.sl.l,on:!!f[o.k],gid:set.id+'|'+o.k,sub:f[o.k]?f[o.k].naam:'nog leeg'}))}
  return landPins(set.land).map(p=>({...p,cur:p.prev===set.id}));
}
function pinSVG(m,pins,big){
  const r=m.w*(big?.022:.05);
  return pins.map((p,n)=>{const [x,y]=proj(m,p.ll[0],p.ll[1]);
    return `<g class="pin${p.on?' on':''}${p.cur?' cur':''}"${big?` data-pin="${n}"`:''}><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(p.cur?r*1.35:r).toFixed(2)}"/>${big?`<text x="${x.toFixed(1)}" y="${(y+r*.42).toFixed(1)}" font-size="${(r*1.15).toFixed(2)}">${n+1}</text>`:''}</g>`}).join('');
}
function landSVG(land,pins,big){
  const m=MAPS.lands[land];if(!m)return '';

  [/^(middenklasse|voor een bijzonder moment|lastig op te sporen)$/,3],[/^(hogere prijsklasse|voor grote gelegenheden|een echte vondst)$/,4],
  [/^(topprijsklasse|een fles voor het leven|een zeldzame vondst)$/,5]];

  [/zeldzaam in Nederland/g,'amper in Nederlandse winkels'],[/ongewoon in Nederland/g,'weinig in Nederlandse winkels'],
  [/cru\/reserva-niveau/g,'een reserva of cru'],[/\btopclassificatie\b/g,'hoogste classificatie'],[/\bgrootformaat\b/g,'magnum of groter']];
const priceWords=r=>{

    for(const [re,k] of PRICE_EUR)if(re.test(x)){eur=k;return false}

function snapshot(){return {started:Object.fromEntries(SETS.map(s=>[s.id,started(s)])),lands:[...st.lands],complete:{...st.complete},visible:{...st.visible},done:Object.fromEntries(SETS.map(s=>[s.id,st.visible[s.id]&&isDone(s)]))}}
function newsSince(b){
  const out=[];
  for(const l of st.lands)if(!b.lands.includes(l))out.push(['Nieuw hoofdstuk',l,l==='Overige landen'?'Je eerste wijn uit een land zonder eigen hoofdstuk. Hij krijgt een plek bij Overige landen en telt mee voor Wereldreiziger II.':'Je eerste wijn uit '+l+'. Er is een nieuw hoofdstuk aan je album toegevoegd.']);
  for(const s of SETS)if(s.part===1&&!s.secret&&st.visible[s.id]&&started(s)&&!b.started[s.id]&&b.lands.includes(s.land))out.push(['Nieuwe bladzijde',s.name,'Deze bladzijde staat nu in je album, met je eerste kaart erin.']);
  for(const s of SETS){
    if(st.visible[s.id]&&!b.visible[s.id]){
      const have=filledOf(s).filter(Boolean).length;
      if(s.unlock)out.push(['Nieuwe set vrijgespeeld',s.name,`Je hebt er al ${have} van de ${s.slots.length}.`]);
      else if(s.secret)out.push(['Geheime set ontdekt',s.name,`${have} van de ${s.slots.length} gevonden.`]);
      else if(s.part===2&&!s.always)out.push(['Nieuwe uitdaging',s.name,`${have} van de ${s.slots.length} gevuld.`]);
    }
    if(st.visible[s.id]&&isDone(s)&&!b.done[s.id])out.push(['Set voltooid',s.name,'Alle '+s.slots.length+' vakken gevuld.']);
  }
  return out;
}
function pickWine(){
  const fresh=POOL.filter(w=>!ownedKeys.has(wkey(w))),dupes=POOL.filter(w=>ownedKeys.has(wkey(w)));
  if(dupes.length&&(Math.random()<.2||!fresh.length))return dupes[Math.floor(Math.random()*dupes.length)];
  if(!fresh.length)return null;
  const icons=fresh.filter(w=>w.icon),normal=fresh.filter(w=>!w.icon);
  const src=icons.length&&(Math.random()<.05||!normal.length)?icons:normal;
  return src[Math.floor(Math.random()*src.length)];
}

async function fileToCanvas(f){

  catch(e){toast('Deze foto kon niet worden geladen. Probeer het opnieuw.');return null}
  const sc=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight));
  const cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*sc);cv.height=Math.round(img.naturalHeight*sc);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
  return cv;
}

const PEND=(()=>{try{const o=JSON.parse(localStorage.getItem('vi_pend')||'{}'),now=Date.now();for(const k in o)if(now-o[k]>120000)delete o[k];return o}catch(e){return {}}})();
const INKED=new Set();let pendTimer=null;
const savePend=()=>{try{localStorage.setItem('vi_pend',JSON.stringify(PEND))}catch(e){}};
function addPending(c){PEND[c.wineId]=Date.now();savePend();startPendPoll()}
function startPendPoll(){if(pendTimer||!Object.keys(PEND).length)return;pendTimer=setInterval(pollPend,5000)}
function inkWine(id,st){
  delete PEND[id];savePend();INKED.add(id);setTimeout(()=>INKED.delete(id),5000);
  cards.filter(x=>x.wineId===id).forEach(x=>{if(st)x.style=st});
  const c=cards.find(x=>x.wineId===id);
  document.querySelectorAll(`.etkbox.sketching[data-w="${id}"]`).forEach(b=>{b.classList.remove('sketching');b.classList.add('inkin');b.innerHTML=(c?drawnLabel(c):'')+'<i class="lfoil"></i>'});
  const pr=document.querySelector('.primeur');if(pr){pr.querySelector('.prstat').innerHTML=st?'✦ Jouw etiket is klaar ✦':'Je etiket wordt later bijgewerkt.';pr.classList.add('klaar')}
  if(st)buzz([30,60,30]);
  setTimeout(()=>{refresh()},1800);
}
async function pollPend(){
  const ids=Object.keys(PEND);if(!ids.length||!session){clearInterval(pendTimer);pendTimer=null;return}
  const now=Date.now();
  for(const id of ids)if(now-PEND[id]>90000)inkWine(id,null);
  const live=Object.keys(PEND);if(!live.length)return;
  const {data,error}=await sb.from('wines').select('id,label_style').in('id',live);
  if(error){console.warn('pend',error);return}
  for(const w of data||[])if(w.label_style&&w.label_style.v===2)inkWine(w.id,w.label_style);
}

async function callDraw(body){
  const r=await sb.functions.invoke('reassess',{body});
  if(r.error){let msg='';try{const j=await r.error.context.clone().json();msg=j.status||''}catch(e){}throw new Error(msg||'mislukt')}
  return r.data;
}

  if(error){o.querySelector('.hint').textContent='Laden lukte niet.';return}
  const R=data||[],ch=R.filter(r=>r.changed),same=R.filter(r=>!r.changed);
  const fmt=v=>v==null?'':String(v).replace('.',',');
  const facts=s=>{const f=[];
    if(s.price_eur_low!=null)f.push(`€${fmt(Math.round(s.price_eur_low))}–${fmt(Math.round(s.price_eur_high))} <i>(${s.price_basis||'schatting'})</i>`);
    if(s.critic_max)f.push(`critici ${s.critic_max}`);

      ${r.next.reason?`<p class="arvr">${whyHTML(priceWords(r.next.reason))}</p>`:''}

      <div class="arva"><button class="btn small" data-skip>Overslaan</button><button class="btn small primary" data-apply>${r.changed?'Toepassen':'Gegevens opslaan'}</button></div></div>`};
  o.innerHTML=o.querySelector('.ovbar').outerHTML+`<p class="status">Klassen herzien</p>
    <p class="hint">${R.length?`Claude zocht deze wijnen op: prijs van dat jaar, Nederlandse winkels, critici. Er verandert niets tot je op Toepassen tikt; alle kaarten van die wijn gaan dan mee.`:'Er zijn geen voorstellen. Open een wijn in "Wijnen beheren" en kies "Klasse controleren op internet".'}</p>

  const done=(el,txt)=>{el.classList.add('done');el.querySelector('.arva').innerHTML=`<small>${txt}</small>`};
  const apply=async el=>{const w=el.dataset.w;el.querySelectorAll('button').forEach(b=>b.disabled=true);

  const here=`<div class="jhere"><span>Je bent hier</span><b>${crumbOf(P)}</b><small>Blad ${cur+1} van ${pages.length}</small></div>`;
  const chapHTML=chap.length>1?`<p class="mgroup">${esc(land)}</p><div class="jchap">${chap.map(({q,k})=>`<button data-pg="${k}" class="${k===cur?'on':''}">${q.t==='chapter'?'Overzicht':q.set?esc(q.set.name):q.t==='overige'?'Overige':esc(plain(crumbOf(q)))}</button>`).join('')}</div>`:'';
  const o=overlay(`<p class="status">Ga naar</p>${here}${chapHTML}<p class="mgroup">Album</p>
    <div class="jtiles">${tile('book','Kelderboek',1)}${tile('star','Top 10',pg('fav'))}${tile('globe','Wereld',pg('world'))}${tile('crown','Legendes',firstPageOf(x=>x.set&&x.set.id==='icons'))}</div>
    <div class="lands jrows"><button data-jact="lands">${MED('grapes')}<b>Landen</b><span>${st.lands.filter(l=>l!=='Overige landen').length} ontdekt</span></button><button data-jact="lists">${MED('trophy')}<b>Uitdagingen</b><span>${SETS.filter(s=>s.part===2&&st.visible[s.id]).length} zichtbaar</span></button></div>`);
  o.querySelector('[data-jact="lands"]').onclick=()=>openLands(null,true);
  o.querySelector('[data-jact="lists"]').onclick=()=>openLists(true);
  (o.querySelector('.jtile')||o.querySelector('.ovback')).focus();
}
function askConfirm(title,text,yes,fn){
  const o=overlay(`<div class="confirm"><p class="status">${esc(title)}</p><p class="hint">${esc(text)}</p>
    <div class="actions"><button class="btn" id="no">Annuleren</button><button class="btn primary" id="yes">${esc(yes)}</button></div></div>`,{nest:true});
  o.querySelector('#no').onclick=()=>popOverlay();o.querySelector('#yes').onclick=()=>{popOverlay();fn()};o.querySelector('#no').focus();
}
const INFO={
  scans:['Scans vandaag',`Je kunt elke dag ${'${LIMIT}'} wijnen scannen. Zo blijft het verzamelen spannend en gaat het om ontdekken, niet om meer drinken. Om middernacht krijg je nieuwe scans.`,'scan'],
  kelder:['Kelderboek','Je inhoudsopgave: hoeveel kaarten je hebt per klasse, welke landen je al ontdekte en welke uitdagingen zichtbaar zijn. Grijze landen zijn nog te ontdekken: tik erop om te zien wat er in hoort.','album'],
  set:['Een set','Elk vak hoort bij een wijngebied. Scan een passende wijn en hij komt vanzelf in het juiste vak. Tik op een leeg vak voor tips: wat het is, wat het kost en waar je hem vindt. Heb je meerdere kaarten voor één vak, dan liggen ze op een stapel (×2, ×3…).','album'],
  lijst:['Uitdaging','Een opdracht dwars door je hele album heen, zoals één druif uit negen gebieden of wijn uit twaalf landen. Je kaarten tellen hier automatisch mee, naast hun eigen set. Sommige lijsten verschijnen pas als je de eerste passende wijn vindt.','album'],
  fav:['Top 10','Je favoriete kaarten, met nummer 1 bovenaan. Open een kaart en tik op ★ Top 10 om hem een plek te geven. De kaart blijft ook gewoon in zijn set.','top'],
  world:['Mijn wijnwereld','Een wereldbol in leer en goud. Sleep om te draaien en een beetje te kantelen, knijp met twee vingers om in te zoomen (dan verschijnen ook de namen van wijnlanden). Landen waar je een kaart uit hebt, kleuren goud: hoe voller, hoe meer kaarten. De rode speldjes zijn je wijnen. Tik op een land om erheen te gaan.','kaarten'],
  stack:['Stapels','Passen meerdere kaarten in hetzelfde vak, dan liggen ze op een stapel. Bovenop ligt de zeldzaamste, tenzij je zelf een andere kiest met "Bovenop leggen".','herproeven']
};
function infoBtn(k){return `<button class="ibtn" data-info="${k}" aria-label="Uitleg">i</button>`}
function openInfoTip(k){
  const d=INFO[k];if(!d)return;
  const o=overlay(`<div class="tip"><p class="tiph"><span class="ibtn on">i</span>${esc(d[0])}</p><p class="tipt">${esc(d[1].replace('${LIMIT}',LIMIT))}</p>
    <div class="actions"><button class="btn" id="more">Meer in Hoe werkt het</button><button class="btn primary" id="ok">Begrepen</button></div></div>`,{nest:true});
  o.querySelector('#ok').onclick=()=>popOverlay();o.querySelector('#more').onclick=()=>openInfo(d[2],true);o.querySelector('#ok').focus();
}
/* ---------- uitleg en uitloggen ---------- */
function openInfo(open,nest){
  const desc={common:'Alledaagse wijn, zoals een supermarktmerk. De regio als reisposter.',rare:'Een stap hoger: ±€20–60, of goedkoper maar zeldzaam in Nederland.',superrare:'Bijzonder: ±€60–200, vaak een gerenommeerde maker of Cru-niveau. Gouden lijst.',ultra:'Topwijn: ±€200 of meer, grote naam of topclassificatie. Saffierblauw.',icon:'De eenentwintig Legendes van de wereld, zoals Pétrus en Screaming Eagle. Prijs telt niet.'};
  const tiers=`<div class="tierlist">${TORDER.map(t=>`<div><span class="tsym">${TIERS[t].sym}</span><span><b>${TIERS[t].label}</b><br><small>${desc[t]}</small></span><span class="todd">${TIERS[t].odds}</span></div>`).join('')}</div>`;
  const sec=(id,ic,title,body)=>`<details class="howto" id="h-${id}"${open===id?' open':''}><summary>${MED(ic)}<span>${title}</span></summary><div class="hbody">${body}</div></details>`;
  const o=overlay(`<p class="status">Hoe werkt Vineder?</p>
    <div class="howtos">
    ${sec('scan','camera','Scannen',`<p>Tik op <b>Scan een wijn</b> en richt de camera op het voorste etiket: recht, scherp en goed belicht. De app leest naam, maker, jaargang en herkomst, en maakt er een kaart van.</p><p>Je hebt <b>${LIMIT} scans per dag</b>. Een foto die niet herkend wordt, telt niet mee. Elke wijn levert één kaart op; de jaargang maakt niet uit.</p>`)}
    ${sec('klassen','sparkle','Kaarten en klassen',`<p><b>De wijn zelf bepaalt de klasse.</b> Bij een nieuwe wijn zoekt de app hem op: wat een fles van dat jaar kost, de classificatie (bijvoorbeeld Cru of Grand Cru), hoe bekend de maker is, hoe groot de oplage is, wat critici ervan vinden en of hij in Nederland te koop is. Een topjaar, een bewaarwijn op leeftijd of een magnum kan hem net een stap hoger tillen. Ouder is niet vanzelf beter: de meeste wijn is gemaakt om jong te drinken.</p>${tiers}<p>Iedereen krijgt voor dezelfde wijn dezelfde klasse. Op de kaart zie je <b>waarom</b>.</p><p><b>Full Art</b> is puur geluk: elke kaart heeft ±5% kans om als Full Art te verschijnen, met de afbeelding over de hele kaart en een holo-glans.</p>`)}
    ${sec('album','book','Je album',`<p>Het <b>Kelderboek</b> is je inhoudsopgave. Daarna volgen je <b>Top 10</b>, je <b>wijnwereld</b> en de hoofdstukken per land.</p><p>Je album <b>groeit mee</b>: een land of streek krijgt pas een bladzijde bij je eerste wijn daarvan. Elke kaart gaat vanzelf naar het juiste vak, en telt ook mee voor de <b>uitdagingen</b> achterin.</p><p>Tik op een <b>leeg vak</b> voor tips: wat het is, wat het kost en waar je hem vindt. <b>Veeg</b> of gebruik de pijltjes om te bladeren; tik bovenaan op de naam van de bladzijde om snel te springen.</p>`)}
    ${sec('herproeven','stack','Stapels en nieuwe flessen',`<p>Scan je een <b>andere</b> wijn voor een vak dat al gevuld is, dan komt hij op de <b>stapel</b> (×2, ×3…). De zeldzaamste ligt bovenop; tik op de stapel om zelf te kiezen.</p><p>Scan je <b>dezelfde</b> wijn nog eens (een nieuwe fles), dan telt hij als <b>nieuwe fles</b>: je kaart krijgt ×2, ×3… gedronken, en je maakt opnieuw kans op een <b>Full Art</b>. Dat kost een scan en kan één keer per dag per wijn.</p>`)}
    ${sec('top','star','Top 10 en herinneringen',`<p>Open een kaart en tik op <b>★ Top 10</b> om hem een plek tussen je favorieten te geven.</p><p>Met <b>✎ Herinnering schrijven</b> zet je een korte tekst in handschrift op de achterkant, met de datum erbij. Tik of veeg over de kaart om hem om te draaien.</p>`)}
    ${sec('bladeren','swipe','Bladeren en terug',`<p>Veeg om te bladeren. Tik bovenin op de <b>naam van het blad</b> voor <b>Ga naar</b>: daar zie je waar je bent, alle bladen van dat land en de vaste plekken zoals je Kelderboek, Top 10, Wereld en Legendes.</p><p>Spring je ergens heen, dan staat bovenin een knopje terug naar waar je was. In elk scherm brengt <b>‹ Terug</b> linksboven je één stap terug.</p>`)}
    ${sec('legendes','crown','Iconen en Legendes',`<p>Een <b>Icoon</b> (✦) is een beroemde wijn van een land, zoals Dom Pérignon voor Frankrijk. Een <b>Legende</b> (♛) is een van de 21 grootste wijnen ter wereld, en krijgt een eigen kaart in leer.</p>`)}
    ${sec('samen','heart','Stickers en wijnvrienden',`<p>Met het stickericoon rechtsboven plak je <b>stickers</b> op elke bladzijde, je omslag en je achterkant. Nieuwe stickers verdien je met ontdekken: nieuwe landen, voltooide sets en Full Arts.</p><p>Daarnaast verdien je <b>stickerkistjes</b>: een wijnkistje met drie stickers in een eigen thema. Je krijgt er een voor je eerste wijnvriend, voor 5 en 10 wijnvrienden, voor wijnen uit 3 en 6 landen, voor rood, wit, rosé én bubbels, voor je eerste Super Rare, voor 5 herinneringen, een volle Top 10, je eerste complete set en een wijn uit de oogsttijd. Zodra je er een verdient, wordt hij bezorgd: tik een paar keer om hem open te krikken. In de stickerlade zie je hoe ver je bent met de volgende.</p><p>Via het menu nodig je <b>wijnvrienden</b> uit. Zij kunnen je album bekijken; je herinneringen blijven privé.</p><p>Bekijk je het album van een wijnvriend, dan zie je bij elke wijn die jullie <b>allebei</b> hebben een 🥂 en een gouden rand. Bovenin staat hoeveel wijnen jullie gemeen hebben en hoe goed jullie smaak bij elkaar past (de Wijnmatch). Met "Alleen samen" laat je alleen die kaarten oplichten. Open zo'n kaart en tik op "Bekijk mijn kaart" om je eigen exemplaar te zien. Bij 10 gedeelde wijnen met één vriend verdien je het Samen-kistje.</p>`)}
    ${sec('kaarten','map','Kaarten',`<p>Rechtsboven op een bladzijde staat een kaartje van het land met speldjes. Tik erop voor een grote kaart met namen. Op <b>Mijn wijnwereld</b> zie je in één oogopslag welke landen je al ontdekte.</p>`)}
    </div>
    <div class="actions"><button class="btn" data-act="tour">${I('play')} Rondleiding</button><button class="btn primary xclose" id="close">Terug naar album</button></div>
    ${session?`<p class="hint small">Ingelogd als ${esc(session.user.email)}</p>`:''}`,{nest:!!nest});
  o.querySelector('#close').onclick=()=>closeOverlay();
  const op=open&&o.querySelector('#h-'+open);if(op)setTimeout(()=>op.scrollIntoView({block:'center'}),60);
}
const TOUR=[
  ['camera','Scan je wijn','Drink je een wijn? Tik op Scan een wijn en fotografeer het etiket. De app herkent de wijn voor je.'],
  ['cards','Krijg een kaart','Elke wijn wordt een kaart, van Common tot Legende. Hoe bijzonderder de wijn, hoe zeldzamer de kaart. En met geluk krijg je een Full Art!'],
  ['book','Vul je album','Je kaart gaat vanzelf naar het juiste vak in je album. Veeg om te bladeren, tik op een kaart om hem te bekijken.'],
  ['globe','Ontdek de wereld','Je album groeit mee met elk nieuw land en elke nieuwe streek. Tik op een leeg vak voor tips. Veel plezier en proost!']
];
function openTour(){
  let n=0;
  const o=overlay(`<div class="tour"><div class="tslide" id="ts"></div><div class="tdots">${TOUR.map((_,k)=>`<i data-k="${k}"></i>`).join('')}</div>
    <div class="actions"><button class="btn" id="tprev">‹ Vorige</button><button class="btn primary" id="tnext">Volgende ›</button></div></div>`);
  const draw=()=>{const [ic,t,x]=TOUR[n];o.querySelector('#ts').innerHTML=`<div class="tic">${I(ic)}</div><p class="status">${t}</p><p class="hint">${x}</p>`;
    o.querySelectorAll('.tdots i').forEach((d,k)=>d.classList.toggle('on',k===n));
    o.querySelector('#tprev').style.visibility=n?'visible':'hidden';o.querySelector('#tnext').textContent=n===TOUR.length-1?'Aan de slag':'Volgende ›'};
  o.querySelector('#tprev').onclick=()=>{if(n>0){n--;draw()}};
  o.querySelector('#tnext').onclick=()=>{if(n<TOUR.length-1){n++;draw()}else{closeOverlay();hintSwipe()}};
  let x0=null;o.addEventListener('pointerdown',e=>x0=e.clientX);o.addEventListener('pointerup',e=>{if(x0===null)return;const dx=e.clientX-x0;x0=null;if(Math.abs(dx)>50){if(dx<0&&n<TOUR.length-1)n++;else if(dx>0&&n>0)n--;draw()}});
  try{localStorage.setItem('vi.tour','1')}catch(e){}
  draw();o.querySelector('#tnext').focus();
}
function hintSwipe(){
  try{if(localStorage.getItem('vi.swipe'))return;localStorage.setItem('vi.swipe','1')}catch(e){}
  const h=document.createElement('div');h.className='swipehint';h.innerHTML='<span>'+I('swipe')+'</span> Veeg om te bladeren';document.body.appendChild(h);setTimeout(()=>h.remove(),4200);
}
async function logout(){
  if(viewing)exitFriend();
  closeOverlay();await sb.auth.signOut();settings={name:'',cover:'bordeaux',pages:'zwart'};adultOK=false;applySettings();LIMIT=3;serverToday=null;session=null;cards=[];ownedKeys=new Set();authStep='login';busy=false;refresh();cur=0;go(0,true);
}

/* ---------- start ---------- */
(async function boot(){
  initViewbar();
  refresh();go(0,true);fitAlbum();
  try{const {data}=await sb.auth.getSession();session=data.session}catch(e){session=null}
  if(session)await loadAlbum();
  loading=false;refresh();go(0,true);fitAlbum();
  if(session){let seen=null;try{seen=localStorage.getItem('vi.tour')}catch(e){seen='1'}if(!seen)setTimeout(openTour,700);else{acceptPendingInvite();setTimeout(pushBoot,2500)}}
  sb.auth.onAuthStateChange((ev,s)=>{
    if(ev==='PASSWORD_RECOVERY'&&s){session=s;authStep='reset';go(0,true);return}
    if(ev==='SIGNED_OUT'&&session){session=null;cards=[];ownedKeys=new Set();refresh();cur=0;go(0,true)}
    else if(ev==='SIGNED_IN'&&s&&!session&&!verifying&&authStep!=='reset'){session=s;loadAlbum().then(()=>{go(0,true);let seen=null;try{seen=localStorage.getItem('vi.tour')}catch(e){seen='1'}if(!seen)setTimeout(openTour,700);else{acceptPendingInvite();setTimeout(pushBoot,2500)}})}
    else if(s)session=s;
  });
})();
</script>
